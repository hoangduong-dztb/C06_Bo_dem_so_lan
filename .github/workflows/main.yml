name: C06 CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Tools (Icarus Verilog & Yosys)
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog yosys make

    - name: Run Simulation
      run: |
        if [ -f "04_IMPLEMENTATION/scripts/01_run_sim.sh" ]; then
          chmod +x 04_IMPLEMENTATION/scripts/01_run_sim.sh
          bash 04_IMPLEMENTATION/scripts/01_run_sim.sh
        else
          echo "No simulation script found, skipping..."
        fi

    - name: Run Synthesis (Yosys)
      run: |
        # Kiểm tra nếu có script tổng hợp thì chạy, hoặc thay bằng lệnh yosys của bạn
        if [ -f "04_IMPLEMENTATION/scripts/02_run_synth.sh" ]; then
          chmod +x 04_IMPLEMENTATION/scripts/02_run_synth.sh
          bash 04_IMPLEMENTATION/scripts/02_run_synth.sh
        else
          echo "No synth script found, skipping..."
        fi

    - name: Upload Build Results / Logs
      uses: actions/upload-artifact@v4
      with:
        name: lab-results
        path: |
          04_IMPLEMENTATION/
