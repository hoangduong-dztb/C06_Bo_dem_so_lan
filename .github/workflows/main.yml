name: C06 CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Icarus Verilog
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog make

    - name: Run Simulation
      run: |
        if [ -f "04_IMPLEMENTATION/scripts/01_run_sim.sh" ]; then
          chmod +x 04_IMPLEMENTATION/scripts/01_run_sim.sh
          bash 04_IMPLEMENTATION/scripts/01_run_sim.sh
        else
          echo "No simulation script found, skipping..."
          exit 0
        fi
